name: Daily Check-in (无人值守)

# 定时 + 手动触发 无人值守签到
# 对应开题报告: "GitHub Actions 定时+日志" 与 "长期稳定运行与自愈"
on:
  schedule:
    # 每日 UTC 01:30 = 北京时间 09:30 (可调整)
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      run_compare:
        description: "是否同时运行对比实验"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  checkin:
    name: 自动签到
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled check-in
        id: checkin
        env:
          # 真实平台凭据从 GitHub Secrets 注入(不落盘, 不进仓库)
          # 在 repo Settings -> Secrets and variables -> Actions 配置:
          #   PLATFORMS_CONFIG: 完整平台JSON(推荐)
          #   或逐平台: PLATFORM_<KEY>_TYPE / _USERNAME / _PASSWORD / _EXTRA
          PLATFORMS_CONFIG: ${{ secrets.PLATFORMS_CONFIG }}
          TZ: "Asia/Shanghai"
        run: python main.py --github

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-logs
          path: logs/
          if-no-files-found: ignore

      - name: Run comparison experiment (optional)
        if: ${{ github.event.inputs.run_compare == 'true' }}
        run: python main.py --compare 100

      - name: Upload experiment results
        if: ${{ github.event.inputs.run_compare == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: |
            experiments/results.json
            experiments/results.md
          if-no-files-found: ignore
