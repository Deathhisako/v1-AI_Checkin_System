name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run demo (self-heal smoke test)
        run: python main.py --demo 10

      - name: Run comparison experiment
        run: python main.py --compare 50

      - name: Upload experiment results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results-${{ matrix.python-version }}
          path: |
            experiments/results.json
            experiments/results.md
          if-no-files-found: ignore
