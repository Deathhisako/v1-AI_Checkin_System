[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicheckin"
version = "0.6.8"
description = "AI辅助自动化生活类签到系统 —— 大模型·OCR·计算机视觉驱动的智能签到"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "刘佳灿", email = "demo@example.com" }]
keywords = ["checkin", "automation", "llm", "ocr", "computer-vision", "self-healing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
ocr = ["paddleocr>=2.7", "opencv-python>=4.9", "numpy>=1.26"]
browser = ["playwright>=1.40"]
llm = ["openai>=1.30"]

[project.scripts]
aicheckin = "aicheckin.cli:main"

[tool.setuptools.packages.find]
include = ["aicheckin*"]

[tool.setuptools.package-data]
aicheckin = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
